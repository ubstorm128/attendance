<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Teacher Register</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-0: #EEF1F6;
            --ink: #0B0B0F;
            --ink-2: #57596B;
            --ink-3: #8A8C9B;
            --blue: #0A6CFF;
            --blue-press: #0857D1;
            --green: #30C36B;
            --amber: #FF9F0A;
            --bad: #E5484D;
            --hair: rgba(60, 60, 67, 0.14);
            --glass: rgba(255, 255, 255, 0.72);
            --glass-strong: rgba(255, 255, 255, 0.92);
            --rail: rgba(20, 20, 30, 0.78);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            color: var(--ink);
            background: var(--bg-0);
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .5;
            z-index: 0;
            pointer-events: none;
        }

        .blob.a {
            width: 420px;
            height: 420px;
            background: #B9CCFF;
            top: -160px;
            left: 10%;
        }

        .blob.b {
            width: 380px;
            height: 380px;
            background: #CDE7FF;
            bottom: -160px;
            right: -60px;
        }

        .blob.c {
            width: 300px;
            height: 300px;
            background: #E3D8FF;
            top: 30%;
            right: 30%;
        }

        /* ── Login screen ── */
        .center {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: .5px solid rgba(255, 255, 255, .6);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 1px 2px rgba(20, 20, 40, .03), 0 16px 36px -18px rgba(20, 20, 40, .2);
            animation: materialize 460ms cubic-bezier(.22, 1, .36, 1) both;
        }

        @keyframes materialize {
            from {
                opacity: 0;
                transform: translateY(8px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .card,
            .stat,
            .panel,
            .qr-shell {
                animation: none !important;
            }
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -.015em;
            margin: 0 0 3px;
        }

        .sub {
            font-size: 13px;
            color: var(--ink-2);
            margin: 0 0 22px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: var(--ink-3);
            margin: 14px 0 7px;
        }

        input {
            display: block;
            width: 100%;
            padding: 11px 14px;
            font-family: inherit;
            font-size: 15px;
            color: var(--ink);
            background: rgba(255, 255, 255, .6);
            border: .5px solid rgba(255, 255, 255, .8);
            border-radius: 12px;
            outline: none;
            transition: background 120ms ease-out, box-shadow 120ms ease-out;
        }

        input:focus {
            background: rgba(255, 255, 255, .9);
            box-shadow: 0 0 0 3px rgba(10, 108, 255, .14);
        }

        button {
            padding: 13px 22px;
            border: none;
            border-radius: 12px;
            background: var(--blue);
            color: #fff;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 600;
            letter-spacing: -.005em;
            cursor: pointer;
            transition: transform 100ms ease-out, background 100ms ease-out, opacity 150ms ease-out;
            white-space: nowrap;
        }

        button:hover {
            background: var(--blue-press);
        }

        button:active {
            transform: scale(.96);
        }

        button.secondary {
            background: rgba(255, 255, 255, .6);
            color: var(--ink);
            border: .5px solid rgba(255, 255, 255, .8);
        }

        button.secondary:hover {
            background: rgba(255, 255, 255, .85);
        }

        button.danger {
            background: var(--bad);
        }

        button.danger:hover {
            background: #C93A3E;
        }

        #loginMsg {
            color: var(--bad);
            font-size: 13px;
            min-height: 16px;
            margin-top: 10px;
        }

        /* ── Ribbon nav ── */
        .ribbon {
            position: sticky;
            top: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 12px 28px;
            background: var(--rail);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -.01em;
            margin-right: 8px;
        }

        .brand .mark {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(160deg, #3E8BFF, #0A6CFF);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px -4px rgba(10, 108, 255, .6);
            flex: none;
        }

        .brand .mark svg {
            width: 15px;
            height: 15px;
        }

        .tabs {
            position: relative;
            display: flex;
            gap: 2px;
            background: rgba(255, 255, 255, .08);
            border-radius: 11px;
            padding: 3px;
        }

        .tab-pill {
            position: absolute;
            top: 3px;
            bottom: 3px;
            left: 3px;
            width: 130px;
            background: rgba(255, 255, 255, .14);
            border-radius: 8px;
            transition: transform 320ms cubic-bezier(.22, 1, .36, 1);
            z-index: 0;
        }

        .nav-item {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 130px;
            padding: 8px 12px;
            border-radius: 8px;
            color: rgba(255, 255, 255, .62);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: color 140ms ease-out, transform 100ms ease-out;
        }

        .nav-item svg,
        .logout svg {
            width: 15px;
            height: 15px;
            opacity: .85;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-item:active {
            transform: scale(.97);
        }

        .ribbon-spacer {
            flex: 1;
        }

        .logout {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 9px;
            color: #FF6961;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 140ms ease-out, transform 100ms ease-out;
        }

        .logout:hover {
            background: rgba(255, 105, 97, .12);
        }

        .logout:active {
            transform: scale(.97);
        }

        /* ── Main content ── */
        main {
            position: relative;
            z-index: 1;
            padding: 34px 40px 60px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        #hello {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -.015em;
            margin: 0 0 3px;
        }

        #today.sub {
            margin: 0 0 26px;
            text-transform: none;
            letter-spacing: normal;
            font-size: 13px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 26px;
        }

        .stat {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: .5px solid rgba(255, 255, 255, .6);
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 1px 2px rgba(20, 20, 40, .03), 0 12px 28px -16px rgba(20, 20, 40, .18);
            animation: materialize 420ms cubic-bezier(.22, 1, .36, 1) both;
        }

        .stat:nth-child(2) {
            animation-delay: 40ms;
        }

        .stat:nth-child(3) {
            animation-delay: 80ms;
        }

        .stat .val {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -.02em;
            line-height: 1;
        }

        .stat:first-child .val {
            color: var(--blue);
        }

        .stat .label {
            font-size: 11.5px;
            color: var(--ink-3);
            font-weight: 500;
            letter-spacing: .02em;
            margin-top: 6px;
        }

        .panel {
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: .5px solid rgba(255, 255, 255, .6);
            border-radius: 20px;
            padding: 26px 26px 8px;
            box-shadow: 0 1px 2px rgba(20, 20, 40, .03), 0 16px 36px -18px rgba(20, 20, 40, .2);
            animation: materialize 460ms cubic-bezier(.22, 1, .36, 1) 100ms both;
        }

        .field-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .field-row .field {
            flex: 1;
            min-width: 220px;
        }

        .field-row label {
            margin: 0 0 7px;
        }

        .field-row button {
            margin: 0 0 1px;
        }

        #closeBtn {
            margin-left: 4px;
        }

        .qr-shell {
            border: 1.5px dashed rgba(10, 108, 255, .3);
            border-radius: 16px;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 22px 0 20px;
            background: rgba(255, 255, 255, .35);
            transition: border-color 200ms ease-out, background 200ms ease-out;
        }

        .qr-shell.live {
            border-style: solid;
            border-color: rgba(10, 108, 255, .25);
            background: rgba(255, 255, 255, .55);
        }

        .qr-placeholder {
            text-align: center;
            color: var(--ink-3);
            font-size: 13px;
            max-width: 220px;
        }

        .qr-placeholder svg {
            width: 34px;
            height: 34px;
            margin-bottom: 10px;
            opacity: .5;
        }

        .qr-live {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 16px;
        }

        #qrBox {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px -10px rgba(20, 20, 40, .3);
            background: #fff;
        }

        #qrBox img,
        #qrBox canvas,
        #qrBox table {
            display: block;
        }

        .qr-meta .subject-name {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -.01em;
            margin: 0 0 4px;
        }

        .qr-meta .expiry {
            font-size: 12.5px;
            color: var(--ink-2);
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
        }

        .dot-live {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 1.6s ease-in-out infinite;
            flex: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .35;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .dot-live {
                animation: none;
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2px;
        }

        thead th {
            text-align: left;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--ink-3);
            padding: 0 8px 12px;
            border-bottom: .5px solid var(--hair);
        }

        tbody td {
            padding: 13px 8px;
            font-size: 13.5px;
            border-bottom: .5px solid var(--hair);
        }

        tbody tr {
            transition: background 120ms ease-out;
        }

        tbody tr:hover {
            background: rgba(10, 108, 255, .04);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .stamp {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
            background: rgba(48, 195, 107, .14);
            color: #1E8E4E;
        }

        .stamp::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
        }

        @keyframes stampIn {
            0% {
                opacity: 0;
                transform: scale(1.8);
            }

            60% {
                opacity: 1;
                transform: scale(.92);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .stamp.animate {
            animation: stampIn .35s ease forwards;
        }

        /* ── History tab ── */
        .hist-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            background: rgba(255, 255, 255, .5);
            border: .5px solid rgba(255, 255, 255, .7);
            border-radius: 14px;
            margin-bottom: 10px;
        }

        .hist-row strong {
            font-weight: 600;
        }

        .hist-row .muted {
            color: var(--ink-3);
            font-size: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .04em;
            background: rgba(10, 108, 255, .14);
            color: var(--blue-press);
        }

        .badge.closed {
            background: rgba(138, 140, 155, .16);
            color: var(--ink-3);
        }

        @media (prefers-contrast: more) {

            .stat,
            .panel,
            .card,
            .hist-row {
                background: #fff;
                backdrop-filter: none;
                border: 1.5px solid var(--ink);
            }

            .ribbon {
                background: #000;
            }
        }

        @media (max-width: 820px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .ribbon {
                flex-wrap: wrap;
                gap: 10px;
                padding: 12px 16px;
            }

            .brand {
                margin-right: 0;
            }

            main {
                padding: 26px 18px 50px;
            }

            .qr-live {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>

    <div id="loginBox" class="center">
        <div class="card" style="width:340px">
            <h1>Teacher Login</h1>
            <p class="sub">Sign in to your register</p>
            <label>Username</label><input id="user">
            <label>Password</label><input id="pass" type="password">
            <button onclick="login()" style="width:100%;margin-top:18px">Login</button>
            <p id="loginMsg"></p>
        </div>
    </div>

    <div id="dash" style="display:none">
        <div class="ribbon">
            <div class="brand">
                <div class="mark"><svg viewBox="0 0 24 24" fill="none">
                        <path d="M4 19V5a2 2 0 0 1 2-2h10l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" stroke="white"
                            stroke-width="2" stroke-linejoin="round" />
                        <path d="M8 9h6M8 13h8" stroke="white" stroke-width="2" stroke-linecap="round" />
                    </svg></div>
                Register
            </div>
            <div class="tabs" id="tabs">
                <div class="tab-pill" id="tabPill"></div>
                <div class="nav-item active" id="tabLive" data-tab="live" onclick="showTab('live')">
                    <svg viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
                        <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    Live Session
                </div>
                <div class="nav-item" id="tabHist" data-tab="history" onclick="showTab('history')">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M3 8h18M3 12h18M3 16h12" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                    History
                </div>
            </div>
            <div class="ribbon-spacer"></div>
            <div class="logout" onclick="logout()">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Logout
            </div>
        </div>

        <main>
            <h1 id="hello"></h1>
            <p class="sub" id="today"></p>

            <div id="liveTab">
                <div class="stats">
                    <div class="stat">
                        <div class="val" id="statPresent">0</div>
                        <div class="label">Present today</div>
                    </div>
                    <div class="stat">
                        <div class="val" id="statSessions">0</div>
                        <div class="label">Total sessions</div>
                    </div>
                    <div class="stat">
                        <div class="val" id="statSubject" style="font-size:20px;">–</div>
                        <div class="label">Current subject</div>
                    </div>
                </div>

                <div class="panel">
                    <div class="field-row">
                        <div class="field">
                            <label for="subject">Subject</label>
                            <input id="subject" placeholder="e.g. Data Structures">
                        </div>
                        <button onclick="generateSession()">Generate QR</button>
                        <button class="danger" id="closeBtn" onclick="closeSession()" style="display:none">Close
                            Session</button>
                    </div>

                    <div class="qr-shell" id="qrShell">
                        <div class="qr-placeholder" id="qrPlaceholder">
                            <svg viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor"
                                    stroke-width="1.6" />
                                <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor"
                                    stroke-width="1.6" />
                                <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor"
                                    stroke-width="1.6" />
                                <path d="M14 14h3v3M20 17v4M17 20h4" stroke="currentColor" stroke-width="1.6"
                                    stroke-linecap="round" />
                            </svg>
                            Enter a subject and generate a QR code for students to scan.
                        </div>
                        <div class="qr-live" id="qrLive" style="display:none">
                            <div id="qrBox"></div>
                            <div class="qr-meta">
                                <p class="subject-name" id="qrSubjectName"></p>
                                <p class="expiry" id="qrHint" style="display:none"><span class="dot-live"></span>
                                    Students scan this with their phone camera to mark attendance.</p>
                            </div>
                        </div>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Enrolment</th>
                                <th>Section</th>
                                <th>Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="rows"></tbody>
                    </table>
                </div>
            </div>

            <div id="historyTab" style="display:none" class="panel">
                <div id="histList"></div>
            </div>
        </main>
    </div>

    <script>
        let teacherId = null, teacherName = null;
        const savedAuth = JSON.parse(localStorage.getItem('teacherAuth') || 'null');
        if (savedAuth) { teacherId = savedAuth.teacherId; teacherName = savedAuth.teacherName; enterDash(); }

        async function login() {
            const username = document.getElementById('user').value;
            const password = document.getElementById('pass').value;
            const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
            const data = await r.json();
            if (r.ok) {
                teacherId = data.teacherId; teacherName = data.teacherName;
                localStorage.setItem('teacherAuth', JSON.stringify({ teacherId, teacherName }));
                enterDash();
            } else document.getElementById('loginMsg').textContent = data.error || 'Invalid credentials';
        }
        function logout() { localStorage.removeItem('teacherAuth'); location.reload(); }
        function enterDash() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dash').style.display = 'block';
            document.getElementById('hello').textContent = teacherName;
            document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            connectStream();
            refreshStats();
        }
        function showTab(tab) {
            document.getElementById('liveTab').style.display = tab === 'live' ? 'block' : 'none';
            document.getElementById('historyTab').style.display = tab === 'history' ? 'block' : 'none';
            document.getElementById('tabLive').classList.toggle('active', tab === 'live');
            document.getElementById('tabHist').classList.toggle('active', tab === 'history');
            const pill = document.getElementById('tabPill');
            pill.style.transform = 'translateX(' + (tab === 'live' ? 0 : 132) + 'px)';
            if (tab === 'history') loadHistory();
        }
        function renderQr(qrToken) {
            const box = document.getElementById('qrBox');
            const shell = document.getElementById('qrShell');
            const placeholder = document.getElementById('qrPlaceholder');
            const live = document.getElementById('qrLive');
            box.innerHTML = '';
            document.getElementById('qrHint').style.display = 'none';
            if (!qrToken) {
                shell.classList.remove('live');
                placeholder.style.display = 'block';
                live.style.display = 'none';
                return;
            }
            const url = `${location.origin}/student.html?token=${qrToken}`;
            new QRCode(box, { text: url, width: 160, height: 160, colorDark: '#0B0B0F', colorLight: '#ffffff' });
            document.getElementById('qrSubjectName').textContent = document.getElementById('subject').value.trim() || 'No subject';
            document.getElementById('qrHint').style.display = 'flex';
            shell.classList.add('live');
            placeholder.style.display = 'none';
            live.style.display = 'flex';
        }
        async function generateSession() {
            const subject = document.getElementById('subject').value.trim();
            const r = await fetch('/api/start-session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ teacherId, subject }) });
            const data = await r.json();
            renderQr(data.qrToken);
            document.getElementById('rows').innerHTML = '';
            document.getElementById('closeBtn').style.display = 'inline-block';
            document.getElementById('statSubject').textContent = subject || '–';
            refreshStats();
        }
        async function closeSession() {
            await fetch('/api/close-session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ teacherId }) });
            document.getElementById('closeBtn').style.display = 'none';
            renderQr(null);
        }
        function connectStream() {
            const es = new EventSource(`/api/stream?teacherId=${teacherId}`);
            es.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'new-session') {
                    document.getElementById('rows').innerHTML = '';
                    renderQr(data.session.qrToken);
                    document.getElementById('closeBtn').style.display = 'inline-block';
                }
                if (data.type === 'closed') {
                    renderQr(null);
                    document.getElementById('closeBtn').style.display = 'none';
                }
                if (data.type === 'mark') { addRow(data.student, true); bumpPresent(); }
                if (data.type === 'init' && data.session) {
                    renderQr(data.session.active ? data.session.qrToken : null);
                    document.getElementById('closeBtn').style.display = data.session.active ? 'inline-block' : 'none';
                    document.getElementById('statSubject').textContent = data.session.subject || '–';
                    Object.values(data.session.present).forEach(s => addRow(s, false));
                    document.getElementById('statPresent').textContent = Object.keys(data.session.present).length;
                }
            };
        }
        function addRow(s, animate) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${s.name}</td><td>${s.enrollment}</td><td>${s.section}</td><td>${new Date(s.time).toLocaleTimeString()}</td><td><span class="stamp${animate ? ' animate' : ''}">Present</span></td>`;
            document.getElementById('rows').appendChild(tr);
        }
        function bumpPresent() {
            const el = document.getElementById('statPresent');
            el.textContent = Number(el.textContent) + 1;
        }
        async function refreshStats() {
            const r = await fetch(`/api/history?teacherId=${teacherId}`);
            const list = await r.json();
            document.getElementById('statSessions').textContent = list.length;
        }
        async function loadHistory() {
            const r = await fetch(`/api/history?teacherId=${teacherId}`);
            const list = await r.json();
            const el = document.getElementById('histList');
            el.innerHTML = list.length ? '' : '<p style="color:var(--ink-3)">No sessions yet.</p>';
            list.forEach(s => {
                const div = document.createElement('div');
                div.className = 'hist-row';
                div.innerHTML = `<div><strong>${s.subject || 'No subject'}</strong><br><span class="muted">${new Date(s.createdAt).toLocaleString()} · ${s.count} present</span></div>
        <div style="display:flex;align-items:center;gap:10px"><span class="badge ${s.active ? '' : 'closed'}">${s.active ? 'active' : 'closed'}</span>
        <button class="secondary" onclick="location.href='/api/export?id=${s.id}'">Export</button>
        <button class="danger" onclick="deleteSession(${s.id})">Delete</button></div>`;
                el.appendChild(div);
            });
        }

        async function deleteSession(sessionId) {
            if (!confirm('Delete this session? This will permanently remove all attendance records for it.')) return;
            await fetch('/api/delete-session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ teacherId, sessionId }) });
            loadHistory();
            refreshStats();
        }
    </script>
</body>

</html>
