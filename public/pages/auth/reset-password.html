<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set New Password · Attendance</title>
    <link rel="stylesheet" href="/styles/shared/main.css">
    <link rel="stylesheet" href="/styles/auth/auth.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">
    <div class="ambient-glow top"></div>
    <div class="ambient-glow bottom"></div>

    <div class="center auth-container">
        <div class="card auth-card" id="resetFormView">
            
            <h1>Set New Password</h1>
            <p class="auth-subtitle">Enter a new password for your account.</p>

            <div id="resetError" style="margin-bottom: 16px; padding: 12px; border-radius: 8px; font-size: 0.9rem; background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2);" hidden>
                <span></span>
            </div>

            <div id="resetForm" class="auth-form">
                <label for="newPassword">New Password</label>
                <div class="password-wrap">
                    <input type="password" id="newPassword" class="form-control" placeholder="••••••••">
                    <button type="button" class="password-toggle" style="display: flex; align-items: center; justify-content: center;" aria-label="Show password" onclick="togglePassword('newPassword', this)">
                        <svg class="eye-open" viewBox="0 0 24 24"><path d="M2.5 12S5.5 5 12 5s9.5 7 9.5 7-3 7-9.5 7S2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-slashed" viewBox="0 0 24 24"><path d="M2.5 12S5.5 5 12 5s9.5 7 9.5 7-3 7-9.5 7S2.5 12 2.5 12Z"></path><path d="M3 3l18 18"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>

                <label for="confirmPassword" style="margin-top: 16px;">Confirm Password</label>
                <div class="password-wrap">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••">
                    <button type="button" class="password-toggle" style="display: flex; align-items: center; justify-content: center;" aria-label="Show password" onclick="togglePassword('confirmPassword', this)">
                        <svg class="eye-open" viewBox="0 0 24 24"><path d="M2.5 12S5.5 5 12 5s9.5 7 9.5 7-3 7-9.5 7S2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-slashed" viewBox="0 0 24 24"><path d="M2.5 12S5.5 5 12 5s9.5 7 9.5 7-3 7-9.5 7S2.5 12 2.5 12Z"></path><path d="M3 3l18 18"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                
                <button class="btn btn-primary btn-block mt-24" id="btnSubmit" onclick="submitReset()">Update Password</button>
            </div>
            
            <div class="auth-footer" style="margin-top: 32px; text-align: center;">
                <a href="/" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">Back to Login</a>
            </div>
            
        </div>
    </div>

    <script src="/scripts/auth/reset-password.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
