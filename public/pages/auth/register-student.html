<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration · Attendance</title>
    <link rel="stylesheet" href="/styles/shared/main.css">
    <link rel="stylesheet" href="/styles/auth/auth.css">
</head>
<body class="auth-page">
    <div class="ambient-glow top"></div>
    <div class="ambient-glow bottom"></div>

    <div class="center auth-container" style="max-width: 420px;">
        <div class="card auth-card">
            <h1>Student Registration</h1>
            <p class="auth-subtitle">Create your student account to access the Attendance platform.</p>
            
            <div class="auth-form active">
                <label>Full Name</label>
                <input id="regStudentName" type="text" placeholder="Chandrachur Chouhan" class="form-control">
                
                <label>Enrollment ID</label>
                <input id="regStudentId" type="text" placeholder="ADTU/1/2024-27/BCAO/..." class="form-control" oninput="this.value = this.value.toUpperCase()">
                
                <label>Email</label>
                <input id="regStudentEmail" type="email" placeholder="student@example.com" class="form-control">
                
                <label for="regStudentSemester">Semester</label>
                <select id="regStudentSemester" class="form-control" onchange="handleSemesterChange(this)">
                    <option value="">Select Semester</option>
                    <option value="1st Sem">1st Sem</option>
                    <option value="2nd Sem">2nd Sem</option>
                    <option value="3rd Sem">3rd Sem</option>
                    <option value="4th Sem">4th Sem</option>
                    <option value="5th Sem">5th Sem</option>
                    <option value="6th Sem">6th Sem</option>
                    <option value="7th Sem">7th Sem</option>
                    <option value="8th Sem">8th Sem</option>
                    <option value="__custom__">Other / Custom</option>
                </select>
                <input id="regStudentSemesterCustom" type="text" placeholder="Enter custom semester (e.g. 9th Sem)" class="form-control" style="display: none; margin-top: 8px;">
                
                <label>Section</label>
                <input id="regStudentSection" type="text" placeholder="A, B, C" class="form-control" oninput="this.value = this.value.toUpperCase()">
                
                <label>Password</label>
                <div class="password-wrap">
                    <input id="regStudentPass" type="password" placeholder="••••••••" class="form-control">
                    <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('regStudentPass', this)">
                        <svg class="eye-open" viewBox="0 0 24 24"><path d="M2.5 12S5.5 5 12 5s9.5 7 9.5 7-3 7-9.5 7S2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-slashed" viewBox="0 0 24 24"><path d="M2.5 12S5.5 5 12 5s9.5 7 9.5 7-3 7-9.5 7S2.5 12 2.5 12Z"></path><path d="M3 3l18 18"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                
                <button onclick="registerStudent()" id="btnRegStudent" class="btn btn-primary btn-block mt-24">Register Student</button>
            </div>
            
            <p id="regMsg" class="auth-msg"></p>
            
            <div class="auth-footer">
                Already have an account? <a href="/login">Sign in</a>
            </div>
        </div>
    </div>
    <script src="/scripts/auth/register.js"></script>
</body>
</html>
